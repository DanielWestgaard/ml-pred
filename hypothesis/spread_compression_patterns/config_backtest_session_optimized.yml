hypothesis:
  name: spread_compression_patterns

# SESSION-OPTIMIZED configuration - removes restrictive session filtering for comprehensive testing
backtesting:
    enabled: true
    model_folder: storage/models/2025-07-27_12:53:02
    
    # Data configuration - Same optimal period but allowing all sessions
    data_source: storage/data/capital_com/GBPUSD/processed/1m/2024-06-01_2025-05-23.csv
    start_date: '2025-04-07'                          # High-signal period
    end_date: '2025-04-09'                            # 2-day focused test
    buffer_size: 200
    
    # Capital and costs
    initial_capital: 10000
    transaction_costs: 0.0013
    slippage: 0.0002
    
    # Execution settings
    execution:
        max_loops: 2880                               # 2 days * 24h * 60min = 2880 loops
        loop_interval: 0
    
    # High-quality signal processing WITHOUT session filtering
    signal_processing:
        confidence_threshold: 0.75                    # High threshold for quality
        signal_filters: []                            # REMOVED session_filter to test all periods
        min_signal_strength: 0.3                      # Quality filter
        volume_confirmation_required: true            # Volume confirmation
        
    # Optimized risk management
    risk_management:
        max_position_size: 0.015                      # Conservative position size (1.5%)
        stop_loss_pct: 0.015                         # Tight stop loss
        take_profit_pct: 0.045                        # Wide take profit (1:3 ratio)
        max_drawdown: 0.04                            # Strict drawdown control
        max_concurrent_positions: 2                   # Limited concurrency
        position_size_scaling: 'volatility'           # Volatility scaling
        
    # Position management
    position_management:
        max_concurrent_positions: 2
        position_tracking: detailed
    
    # OPTIMIZED intelligent exit strategy (proven best parameters)
    exit_strategy:
        confidence_exit_threshold: 0.35               # Best performing threshold
        signal_strength_decay: 0.17                   # Enhanced sensitivity
        volatility_exit_multiplier: 1.3               # Sensitive volatility detection
        minimum_signal_life: 5                        # Conservative protection
    
    # Enhanced signal tracking
    signal_tracking:
        signal_strength_features:
            - compression_ratio_micro                  # Core compression
            - volume_ratio                             # Volume confirmation
            - signal_strength_v2                       # Enhanced signal strength
            - compression_consistency                  # Consistency metric
            - volatility_short                         # Volatility tracking
            - spread_baseline                          # Spread baseline