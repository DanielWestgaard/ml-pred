hypothesis:
  name: spread_compression_patterns

# Data Pipeline: Process raw data with optimized 8-feature set
data_pipeline:
  raw_source: storage/data/capital_com/GBPUSD/raw/1m/2024-06-01_2025-05-23.csv
  spread_focused: true  # Enable bid-ask spread data preservation

  selected_features:  # OPTIMIZED FEATURE SET - 8 CORE FEATURES (redundancy eliminated)
    [
      # Primary compression signal (most sensitive, no redundancy)
      'compression_ratio_micro',      # 30min/3min timeframe (eliminated short due to 0.905 correlation)
      'compression_consistency',      # Strongest predictor (-0.4169 correlation)
      
      # Enhanced signal strength (optimized weights)
      'signal_strength_v2',           # Combines all signals with optimal weights
      
      # Volume confirmation suite (comprehensive coverage)
      'volume_ratio',                 # 1.52x movement ratio (strongest individual)
      'volume_acceleration',          # Volume momentum detection
      'volume_breakout',              # Z-score > 2 breakout detection
      
      # Context features (market timing & price)
      'london_session',               # Session timing (proven effective)
      'price_momentum_5',             # 5-period price momentum
      
      # Target for binary classification
      'future_price_change'
    ]

# Model Training: Random Forest Classifier optimized for Tier 2+ signals
model_training:
    type: random_forest                               # Random Forest Classifier for imbalanced data

    # Will automatically use processed data from data_pipeline above
    # processed_data: storage/data/capital_com/GBPUSD/processed/1m/2024-06-01_2025-05-23.csv
    
    target_column: target_spread_compression_binary   # Use binary classification target (0/1) instead of multi-class

    parameters:                                       # Optimized for spread compression (0.18% positive class)
        n_estimators: 300                             # More trees for rare signal detection
        max_depth: 10                                 # Deeper trees for complex market patterns
        min_samples_split: 5                          # Lower threshold for rare Tier 2+ patterns
        min_samples_leaf: 2                           # Sensitive to minority class patterns
        class_weight: balanced                        # Critical for 0.18% positive class ratio
        bootstrap: true                               # Enable bootstrap sampling
        oob_score: true                               # Out-of-bag evaluation for validation
        random_state: 42                              # Reproducible results
        n_jobs: -1                                    # Use all available CPU cores
        max_features: sqrt                            # sqrt(n_features) for classification

# Backtesting: Rapid strategy validation with historical data
backtesting:
    enabled: true                                     # Enable backtesting mode
    
    # Data configuration
    data_source: storage/data/capital_com/GBPUSD/processed/1m/2024-06-01_2025-05-23.csv  # Processed data for backtesting
    start_date: '2024-10-01'                          # Start from end of training period
    end_date: '2025-05-23'                            # Test data end date
    buffer_size: 200                                  # Historical buffer for feature generation
    
    # Capital and costs
    initial_capital: 10000                            # Starting capital for simulation
    transaction_costs: 0.0013                        # 1.3 pips for GBPUSD (realistic spread)
    slippage: 0.0002                                  # 0.2 pips average slippage
    
    # Execution settings
    execution:
        max_loops: null                               # Process all historical data (null = unlimited)
        loop_interval: 0                              # No delays in backtesting (0 = instant)
    
    # Signal processing (inherit from strategy)
    signal_processing:
        confidence_threshold: 0.6                     # Minimum confidence for signal generation
        signal_filters: ['session_filter']            # Apply session-based filtering
    
    # Risk management (inherit from strategy)
    risk_management:
        max_position_size: 0.02                       # 2% of capital per position
        stop_loss_pct: 0.01                          # 1% stop loss
        take_profit_pct: 0.02                        # 2% take profit
        max_drawdown: 0.05                           # 5% maximum drawdown limit
        max_concurrent_positions: 3                   # Maximum 3 simultaneous positions
    
    # Position management
    position_management:
        max_concurrent_positions: 3                   # Consistent with risk management
        position_tracking: detailed                   # Detailed position tracking for analysis

# Optional: Evaluate the trained model
# evaluate_model:
#     type: new                                       # Evaluate newly trained model
#     # type: stored                                  # Or evaluate pre-trained model
#     # model_folder: storage/models/2025-07-27_14:30:00