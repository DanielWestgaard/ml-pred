hypothesis:
  name: spread_compression_patterns

# Backtesting: Rapid strategy validation with historical data
backtesting:
    enabled: true
    model_folder: storage/models/2025-07-28_11:42:44
    
    # Test on signal-rich period with 1,291 positive signals (44.82% rate)
    data_source: storage/data/capital_com/GBPUSD/processed/1m/2023-01-01_2025-07-01.csv
    start_date: '2024-06-04'                          # Signal-rich period with 1,291 positive signals
    end_date: '2024-06-08'                            # Two days for proper testing
    buffer_size: 200
    
    # Capital and costs
    initial_capital: 10000
    transaction_costs: 0.0005 # temporarily low to isolate model performance from cost impact, was 0.0013
    slippage: 0.0002
    
    # Execution settings
    execution:
        max_loops: 1000                               # 48 hours * 60 min = 2880 loops for 2 days
        loop_interval: 0
    
    # More realistic signal processing with cleaned model
    signal_processing:
        confidence_threshold: 0.51                    # Lower threshold to get more signals
        signal_filters: []                            # No session filtering for testing
        min_signal_strength: 0.3                      # Quality filter
        volume_confirmation_required: true            # Volume confirmation
        
    # Conservative risk management
    risk_management:
        max_position_size: 0.015                      # 1.5% position size
        stop_loss_pct: 0.015                         # 1.5% stop loss
        take_profit_pct: 0.045                        # 4.5% take profit (1:3 ratio)
        max_drawdown: 0.04                            # 4% max drawdown
        max_concurrent_positions: 2                   # Max 2 positions
        position_size_scaling: 'volatility'           # Volatility scaling
        
    # Position management
    position_management:
        max_concurrent_positions: 2
        position_tracking: detailed
    
    # Enable intelligent confidence-based exits  
    exit_strategy:
        confidence_exit_threshold: 0.75               # Exit when model is 75%+ confident compression is over
        signal_strength_decay: 0.90                   # VERY HIGH - effectively disable decay exits  
        volatility_exit_multiplier: 5.0               # VERY HIGH - effectively disable volatility exits
        minimum_signal_life: 15                       # 15 minutes minimum - allow faster exits
    
    # Signal tracking
    signal_tracking:
        signal_strength_features:
            - compression_ratio_micro
            - volume_ratio
            - signal_strength_v2
            - compression_consistency
            - volatility_short
            - spread_baseline