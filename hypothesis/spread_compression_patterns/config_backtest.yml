hypothesis:
  name: spread_compression_patterns

# Backtesting: Rapid strategy validation with historical data
backtesting:
    enabled: true                                     # Enable backtesting mode
    model_folder: storage/models/2025-07-27_12:53:02
    
    # Data configuration  
    data_source: storage/data/capital_com/GBPUSD/processed/1m/2024-06-01_2025-05-23.csv  # Use same data as training
    start_date: '2025-01-01'                          # Use out-of-sample period  
    end_date: '2025-01-31'                            # Test data end date (1 month for testing)
    buffer_size: 200                                  # Historical buffer for feature generation
    
    # Capital and costs
    initial_capital: 10000                            # Starting capital for simulation
    transaction_costs: 0.0013                        # 1.3 pips for GBPUSD (realistic spread)
    slippage: 0.0002                                  # 0.2 pips average slippage
    
    # Execution settings
    execution:
        max_loops: 10000                              # starting a bit lower for testing purposes, 50 000 - Allow full month of 1-minute data (31 days * 24h * 60m = ~44,640)
        loop_interval: 0                              # No delays in backtesting (0 = instant)
    
    # Signal processing (inherit from strategy)
    signal_processing:
        confidence_threshold: 0.51                    # Accept medium-high confidence positive predictions  
        signal_filters: ['session_filter']            # Apply session-based filtering
    
    # Risk management (inherit from strategy)
    risk_management:
        max_position_size: 0.02                       # 2% of capital per position
        stop_loss_pct: 0.02                          # 2% stop loss
        take_profit_pct: 0.04                        # 4% take profit
        max_drawdown: 0.05                           # 5% maximum drawdown limit
        max_concurrent_positions: 3                   # Maximum 3 simultaneous positions
    
    # Position management
    position_management:
        max_concurrent_positions: 3                   # Consistent with risk management
        position_tracking: detailed                   # Detailed position tracking for analysis
