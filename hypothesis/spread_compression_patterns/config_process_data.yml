hypothesis:
  name: spread_compression_patterns

data_pipeline:
  raw_source: storage/data/capital_com/GBPUSD/raw/1m/2023-01-01_2025-07-01.csv
  spread_focused: true  # Enable bid-ask spread data preservation (default: false)

  selected_features:  # OPTIMIZED FEATURE SET - 8 CORE FEATURES (redundancy eliminated)
    [
      # Primary compression signal (most sensitive, no redundancy) 
      'compression_ratio_micro',      # 30min/3min timeframe (eliminated short due to 0.905 correlation)
      'compression_consistency',      # Strongest predictor (-0.4169 correlation)
      
      # Enhanced signal strength (optimized weights)
      'signal_strength_v2',           # Combines all signals with optimal weights
      
      # Volume confirmation suite (comprehensive coverage)
      'volume_ratio',                 # 1.40x movement ratio (strongest individual)
      'volume_acceleration',          # Volume momentum detection  
      'volume_breakout',              # Z-score > 2 breakout detection
      
      # Context features (market timing & price)
      'london_session',               # Session timing (proven effective)
      'price_momentum_5',             # 5-period price momentum
      
      # ===== NEW ORDER FLOW IMBALANCE FEATURES (12) =====
      # Basic order flow patterns
      'price_volume_imbalance',       # Efficiency of price moves vs volume (institutional vs retail)
      'institutional_pressure',       # Sustained moves with decreasing volume
      'order_flow_momentum',          # Persistent directional flow over multiple periods
      
      # Stealth institutional activity
      'volume_price_divergence',      # Price moves opposite to volume expectations 
      'stealth_accumulation',         # Price drifts higher on lower volume (institutions accumulating)
      'distribution_pressure',        # Price weakens despite normal/high volume (institutions distributing)
      
      # Candlestick wick analysis
      'wick_analysis',                # Overall wick-to-range ratio
      'rejection_strength',           # Long wicks + small bodies = strong rejection
      'absorption_capacity',          # Large bodies + small wicks = strong absorption
      
      # Institutional footprint detection
      'momentum_volume_sync',         # Correlation between momentum and volume changes
      'flow_direction_strength',      # Consistency of directional flow with volume support
      'institutional_footprint'       # Combined institutional activity signal
    ]
