hypothesis:
  name: spread_compression_patterns_v3

# Model training with SMOTE + Extreme weights for the most aggressive approach
model_training:
    type: random_forest
    processed_data: storage/data/capital_com/GBPUSD/processed/1m/2024-01-01_2025-03-01.csv
    target_column: target_spread_compression_v3_directional
    exclude_basic_ohlc: true  # Focus on hybrid features only, exclude basic OHLC
    parameters:
        # Random Forest parameters optimized for extreme imbalance
        n_estimators: 500              # More trees for better minority class learning
        max_depth: 8                   # Shallower for better generalization on real data
        min_samples_split: 2           # Very low for capturing rare patterns
        min_samples_leaf: 1            # Single sample leaves for rare patterns
        class_weight: {0: 1, 1: 50, 2: 50}  # EXTREME weights + SMOTE
        bootstrap: true
        oob_score: true
        random_state: 42
        n_jobs: -1
        max_features: sqrt
        criterion: gini
        
        # SMOTE oversampling parameters - AGGRESSIVE  
        use_smote: true
        smote_strategy: {0: 200000, 1: 200000, 2: 200000}  # Force equal distribution
        
        # Additional parameters for generalization
        min_impurity_decrease: 0.001   # Prevent overfitting to training noise
        max_leaf_nodes: 1000          # Limit complexity

# Walk-forward validation configuration
walk_forward:
    initial_training_months: 4
    validation_period_months: 1
    step_forward_months: 1
    min_training_samples: 50000