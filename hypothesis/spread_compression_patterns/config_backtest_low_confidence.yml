hypothesis:
  name: spread_compression_patterns_v2

# Backtesting configuration with LOW confidence thresholds for imbalanced models
backtesting:
  enabled: true
  model_folder: storage/models/2025-07-30_12:57:06  # Update this to your latest model
  data_source: storage/data/capital_com/GBPUSD/processed/1m/2025-03-02_2025-07-01.csv
  start_date: "2025-06-08"
  end_date: "2025-06-16"
  buffer_size: 200
  initial_capital: 10000
  transaction_costs: 0.0005
  slippage: 0.0002

  execution:
    max_loops: 5000
    loop_interval: 0

  signal_processing:
    confidence_threshold: 0.001   # VERY LOW threshold to allow weak signals through
    signal_filters: []
    min_signal_strength: 0.001    # VERY LOW minimum signal strength
    volume_confirmation_required: false

  risk_management:
    max_position_size: 0.05       # Smaller position size due to low confidence
    stop_loss_pct: 0.01           # Tighter stop loss
    take_profit_pct: 0.03         # Tighter take profit
    max_drawdown: 0.5
    max_concurrent_positions: 1   # Only 1 position at a time
    position_size_scaling: "volatility"

  position_management:
    max_concurrent_positions: 1
    position_tracking: "detailed"

  exit_strategy:
    confidence_exit_threshold: 0.80   # Lower exit threshold
    signal_strength_decay: 0.9
    volatility_exit_multiplier: 3.0
    minimum_signal_life: 5        # Shorter minimum hold time

  signal_tracking:
    signal_strength_features:
      - compression_ratio_micro
      - volume_ratio
      - signal_strength_v2
      - compression_consistency
      - volatility_short
      - spread_baseline