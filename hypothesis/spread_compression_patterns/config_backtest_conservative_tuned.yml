hypothesis:
  name: spread_compression_patterns

# CONSERVATIVE TUNED configuration - addressing 0% win rate issue
backtesting:
    enabled: true
    model_folder: storage/models/2025-07-27_12:53:02
    
    # Test on single high-signal day for faster iteration
    data_source: storage/data/capital_com/GBPUSD/processed/1m/2024-06-01_2025-05-23.csv
    start_date: '2025-04-07'                          # High-signal day
    end_date: '2025-04-08'                            # Single day for quick testing
    buffer_size: 200
    
    # Capital and costs
    initial_capital: 10000
    transaction_costs: 0.0013
    slippage: 0.0002
    
    # Execution settings
    execution:
        max_loops: 1440                               # 24 hours * 60 min = 1440 loops
        loop_interval: 0
    
    # High-quality signal processing (no session filtering for testing)
    signal_processing:
        confidence_threshold: 0.75                    # Keep high entry threshold
        signal_filters: []                            # No session filtering for testing
        min_signal_strength: 0.3                      # Quality filter
        volume_confirmation_required: true            # Volume confirmation
        
    # Conservative risk management
    risk_management:
        max_position_size: 0.015                      # 1.5% position size
        stop_loss_pct: 0.015                         # 1.5% stop loss
        take_profit_pct: 0.045                        # 4.5% take profit (1:3 ratio)
        max_drawdown: 0.04                            # 4% max drawdown
        max_concurrent_positions: 2                   # Max 2 positions
        position_size_scaling: 'volatility'           # Volatility scaling
        
    # Position management
    position_management:
        max_concurrent_positions: 2
        position_tracking: detailed
    
    # MUCH MORE CONSERVATIVE exit strategy to allow pattern development
    exit_strategy:
        confidence_exit_threshold: 0.15               # MUCH LOWER - allow pattern to develop (was 0.35)
        signal_strength_decay: 0.40                   # HIGHER - less sensitive to decay (was 0.17)
        volatility_exit_multiplier: 2.0               # HIGHER - less sensitive to volatility (was 1.3)
        minimum_signal_life: 10                       # LONGER - 10 minutes minimum (was 5)
    
    # Signal tracking
    signal_tracking:
        signal_strength_features:
            - compression_ratio_micro
            - volume_ratio
            - signal_strength_v2
            - compression_consistency
            - volatility_short
            - spread_baseline