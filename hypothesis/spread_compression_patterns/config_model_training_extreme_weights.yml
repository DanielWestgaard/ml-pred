hypothesis:
  name: spread_compression_patterns_v2

# Model training with EXTREME class weighting for severe imbalance
model_training:
    type: random_forest
    processed_data: storage/data/capital_com/GBPUSD/processed/1m/2024-01-01_2025-03-01.csv
    target_column: target_spread_compression_v2_directional
    exclude_basic_ohlc: true  # Focus on hybrid features only, exclude basic OHLC
    parameters:
        n_estimators: 500          # More trees for better minority class learning
        max_depth: 15              # Deeper trees to capture complex patterns
        min_samples_split: 2       # Lower split threshold for minority classes
        min_samples_leaf: 1        # Single sample leaves for rare patterns
        class_weight: {0: 1, 1: 40, 2: 40}  # EXTREME weights: HOLD=1, BUY=40, SELL=40
        bootstrap: true
        oob_score: true
        random_state: 42
        n_jobs: -1
        max_features: sqrt
        
        # Additional parameters for imbalanced learning
        criterion: gini            # Good for imbalanced data
        warm_start: false

# Walk-forward validation configuration
walk_forward:
    initial_training_months: 4
    validation_period_months: 1
    step_forward_months: 1
    min_training_samples: 50000