hypothesis:
  name: spread_compression_patterns_v3

# Model training with balanced V3 target (15-20% signal rate)
model_training:
    type: random_forest
    processed_data: storage/data/capital_com/GBPUSD/processed/1m/2025-03-02_2025-07-01.csv
    target_column: target_spread_compression_v3_directional
    exclude_basic_ohlc: true  # Focus on hybrid features only, exclude basic OHLC
    parameters:
        n_estimators: 300
        max_depth: 10              # Slightly shallower for better generalization
        min_samples_split: 3       # Lower for capturing minority patterns
        min_samples_leaf: 2        # Keep at 2 for pattern detection
        class_weight: balanced     # Let sklearn calculate balanced weights automatically
        bootstrap: true
        oob_score: true
        random_state: 42
        n_jobs: -1
        max_features: sqrt
        
        # Enhanced parameters for better minority class learning
        criterion: gini
        min_impurity_decrease: 0.0
        max_leaf_nodes: null

# Walk-forward validation configuration
walk_forward:
    initial_training_months: 4
    validation_period_months: 1
    step_forward_months: 1
    min_training_samples: 50000