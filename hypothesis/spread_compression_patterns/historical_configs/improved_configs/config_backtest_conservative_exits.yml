backtesting:
  buffer_size: 200
  data_source: storage/data/capital_com/GBPUSD/processed/1m/2024-06-01_2025-05-23.csv
  enabled: true
  end_date: '2025-04-14'
  execution:
    loop_interval: 0
    max_loops: 2000
  initial_capital: 10000
  model_folder: storage/models/2025-07-27_12:53:02
  period_selection:
    criteria:
      avoid_low_liquidity: true
      economic_calendar_filter: true
      market_session_focus:
      - london_session
      signal_density_min: 5
      volatility_threshold: 0.008
    method: adaptive
    rolling_windows:
      adaptive_rebalancing: true
      performance_validation_window: 14
      signal_detection_window: 7
  position_management:
    max_concurrent_positions: 3
    position_tracking: detailed
  risk_management:
    adaptive_stops: true
    max_concurrent_positions: 3
    max_drawdown: 0.05
    max_position_size: 0.02
    profit_target_scaling: true
    stop_loss_pct: 0.02
    take_profit_pct: 0.04
    trailing_stop: true
    trailing_stop_distance: 0.01
    volatility_multiplier: 1.5
  signal_processing:
    confidence_threshold: 0.7
    exit_strategy:
      confidence_exit_threshold: 0.2
      confirmation_windows:
      - 1
      - 3
      - 5
      method: intelligent
      minimum_signal_life: 3
      signal_strength_decay: 0.3
      volatility_exit_multiplier: 2.0
    signal_filters:
    - session_filter
  signal_tracking:
    confidence_adjustment:
      session_bonus: 0.05
      signal_age_decay: 0.02
      volatility_boost: 0.1
    exit_conditions:
      compression_reversal: 0.15
      multi_feature_consensus: 0.6
      signal_strength_drop: 0.25
      volume_confirmation_loss: true
    signal_strength_features:
    - compression_ratio_micro
    - volume_ratio
    - signal_strength_v2
    - compression_consistency
    track_signal_evolution: true
  slippage: 0.0002
  start_date: '2025-04-07'
  transaction_costs: 0.0013
hypothesis:
  name: spread_compression_patterns
