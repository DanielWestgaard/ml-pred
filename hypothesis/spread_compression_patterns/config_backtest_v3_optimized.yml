hypothesis:
  name: spread_compression_patterns_v3

# Optimized backtest config with reduced signal filtering
backtesting:
  enabled: true
  model_folder: storage/models/2025-07-30_19:30:29  # Our working SMOTE model
  data_source: storage/data/capital_com/GBPUSD/processed/1m/2025-03-02_2025-07-01.csv
  start_date: "2025-03-10"
  end_date: "2025-03-20"  # 10 days
  buffer_size: 200
  initial_capital: 10000
  transaction_costs: 0.0005
  slippage: 0.0002

  execution:
    max_loops: 3000  # Force completion 
    loop_interval: 0

  signal_processing:
    use_advanced_filtering: true   # Keep advanced filtering but with relaxed parameters
    confidence_threshold: 0.001    # Very low threshold - model confidences are good
    min_confidence_delta: 0.0      # Disable confidence delta - model is consistent
    cooldown_minutes: 2            # REDUCED: Allow signals every 2 minutes instead of 10
    max_signals_per_hour: 20       # INCREASED: Allow up to 20 signals per hour instead of 8
    confidence_window_minutes: 5   # REDUCED: Shorter window for more responsive filtering
    signal_filters: []
    min_signal_strength: 0.35      # REDUCED: Lower threshold to catch more valid signals
    volume_confirmation_required: false

  risk_management:
    max_position_size: 0.08
    stop_loss_pct: 0.012
    take_profit_pct: 0.035
    max_drawdown: 0.5
    max_concurrent_positions: 2
    position_size_scaling: "volatility"

  position_management:
    max_concurrent_positions: 2
    position_tracking: "detailed"

  exit_strategy:
    confidence_exit_threshold: 0.85
    signal_strength_decay: 0.8
    volatility_exit_multiplier: 2.5
    minimum_signal_life: 8

  signal_tracking:
    signal_strength_features:
      - compression_ratio_micro
      - volume_ratio
      - signal_strength_v2
      - compression_consistency
      - volatility_short
      - spread_baseline