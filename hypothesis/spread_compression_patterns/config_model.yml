hypothesis:
  name: spread_compression_patterns

# Use processed data from config_process_data.yml pipeline
model_training:
    type: random_forest                               # Random Forest Classifier optimized for imbalanced data

    # Optional: Will use processed data from data pipeline if not specified
    processed_data: storage/data/capital_com/GBPUSD/processed/1m/2023-01-01_2025-07-01.csv

    parameters:                                       # Optimized for spread compression patterns (0.18% positive class)
        n_estimators: 300                             # More trees for rare signal detection
        max_depth: 10                                 # Deeper trees for complex patterns
        min_samples_split: 5                          # Lower for rare Tier 2+ patterns
        min_samples_leaf: 2                           # Sensitive to minority class
        class_weight: balanced                        # Critical for imbalanced data
        bootstrap: true                               # Enable bootstrap sampling
        oob_score: true                               # Out-of-bag evaluation
        random_state: 42                              # Reproducible results
        n_jobs: -1                                    # Use all CPU cores
        max_features: sqrt                            # sqrt(n_features) for classification
