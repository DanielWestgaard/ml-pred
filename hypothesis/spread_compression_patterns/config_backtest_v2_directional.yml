hypothesis:
  name: spread_compression_patterns_v2  # Uses the enhanced V2 directional target system

# Backtesting configuration for the three-class directional model
backtesting:
  model_path: storage/models/2025-07-29_12:25:15  # Path to the new V2 directional model
  
  # Use processed data with directional targets
  processed_data: storage/data/capital_com/GBPUSD/processed/1m/2024-10-01_2025-07-25.csv
  
  # Strategy configuration optimized for three-class directional signals  
  strategy:
    type: spread_compression_patterns  # Use the spread compression strategy
      
  # Signal processing configuration for three-class model (moved to backtesting level)
  signal_processing:
    confidence_threshold: 0.05       # Lower threshold for V2 three-class model
    signal_filters: []               # No additional filters
      
  # Position management for directional signals  
  position_management:
    position_size: 0.01              # Conservative position sizing
    max_positions: 1                 # Single position focus
      
  # Risk management
  risk_management:
    stop_loss: 0.0015               # 1.5 pips stop loss
    take_profit: 0.003              # 3.0 pips take profit (2:1 reward:risk)
    max_daily_loss: 0.02            # 2% max daily loss
      
  # Backtesting parameters
  parameters:
    start_date: '2025-07-01'           # Use recent data for directional validation
    end_date: '2025-07-25'             # End of available data
    initial_balance: 10000             # Starting capital
    commission: 0.0001                 # 1 pip spread cost