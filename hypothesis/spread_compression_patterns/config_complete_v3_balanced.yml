hypothesis:
  name: spread_compression_patterns_v3

# Complete pipeline with balanced V3 target and optimized parameters
data_pipeline:
  raw_source: storage/data/capital_com/GBPUSD/raw/1m/2024-01-01_2025-03-01.csv
  spread_focused: true
  selected_features:  # Enhanced hybrid features
    [
      'microstructure_momentum_fusion',
      'depth_stability', 
      'volume_ratio',
      'institutional_footprint',
      'top_predictor_interaction'
    ]

model_training:
    type: random_forest
    target_column: target_spread_compression_v3_directional  # New balanced target
    exclude_basic_ohlc: true
    parameters:
        n_estimators: 300
        max_depth: 10
        min_samples_split: 3
        min_samples_leaf: 2
        class_weight: balanced
        bootstrap: true
        oob_score: true
        random_state: 42
        n_jobs: -1
        max_features: sqrt

# Backtesting with low confidence thresholds for the balanced model
backtesting:
  enabled: true
  data_source: storage/data/capital_com/GBPUSD/processed/1m/2025-03-02_2025-07-01.csv
  start_date: "2025-06-08"
  end_date: "2025-06-16"
  buffer_size: 200
  initial_capital: 10000
  transaction_costs: 0.0005
  slippage: 0.0002

  signal_processing:
    confidence_threshold: 0.02    # Low threshold for balanced model
    min_signal_strength: 0.02
    volume_confirmation_required: false

  risk_management:
    max_position_size: 0.08
    stop_loss_pct: 0.012
    take_profit_pct: 0.035
    max_drawdown: 0.5
    max_concurrent_positions: 2
    position_size_scaling: "volatility"

  exit_strategy:
    confidence_exit_threshold: 0.85
    signal_strength_decay: 0.8
    volatility_exit_multiplier: 2.5
    minimum_signal_life: 8

  signal_tracking:
    signal_strength_features:
      - compression_ratio_micro
      - volume_ratio
      - signal_strength_v2
      - compression_consistency
      - volatility_short
      - spread_baseline

# Walk-forward validation
walk_forward:
    initial_training_months: 4
    validation_period_months: 1
    step_forward_months: 1
    min_training_samples: 50000