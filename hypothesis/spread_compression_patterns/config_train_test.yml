hypothesis:
  name: spread_compression_patterns_v2

data_pipeline:
  raw_source: storage/data/capital_com/GBPUSD/raw/1m/2024-01-01_2025-03-01.csv
  spread_focused: true

  selected_features:  # TEST COMBINATION 1: Top 3 traditional features
    [
      'depth_stability',                 # 0.967 - TOP traditional predictor  
      'volume_ratio',                    # 0.912 - Strong volume confirmation
      'institutional_footprint'          # 0.878 - Institutional detection
    ]

model_training:
  enabled: true
  model_type: random_forest
  target_column: target_spread_compression_v2_directional
  
  validation:
    method: walk_forward
    periods: 5
  
  hyperparameters:
    n_estimators: 300
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
    max_features: sqrt
    class_weight: balanced
    random_state: 42
    n_jobs: -1
    oob_score: true