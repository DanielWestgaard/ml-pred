hypothesis:
  name: spread_compression_patterns_v4_enhanced

# ENHANCED MODEL TRAINING WITH FORWARD-LOOKING TARGETS
model_training:
    type: random_forest
    processed_data: storage/data/capital_com/GBPUSD/processed/1m/2023-01-01_2025-07-01.csv
    target_column: target_spread_compression_v4_directional  # NEW V4 forward-looking target
    exclude_basic_ohlc: true  # Focus on enhanced features only
    parameters:
        n_estimators: 500                  # Increased for better ensemble learning
        max_depth: 12                      # Slightly deeper for complex patterns
        min_samples_split: 2               # Lower for capturing minority patterns
        min_samples_leaf: 1                # Minimum for maximum pattern detection
        class_weight: balanced             # Handle class imbalance
        bootstrap: true
        oob_score: true
        random_state: 42
        n_jobs: -1
        max_features: sqrt                 # Good for many features
        
        # Enhanced parameters for temporal pattern learning
        criterion: gini                    # Good for classification
        min_impurity_decrease: 0.0001      # Small threshold for pattern detection
        max_leaf_nodes: null               # No limit for complex patterns
        
        # Advanced RF parameters for temporal data
        warm_start: false
        ccp_alpha: 0.0                     # No cost complexity pruning
        max_samples: null                  # Use all samples

# Enhanced validation for temporal data
walk_forward:
    initial_training_months: 6             # Longer initial training for stability
    validation_period_months: 1
    step_forward_months: 1
    min_training_samples: 100000           # More samples for complex patterns