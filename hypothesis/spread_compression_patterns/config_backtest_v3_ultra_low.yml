hypothesis:
  name: spread_compression_patterns_v3

# Ultra-low confidence thresholds for SMOTE-trained models
backtesting:
  enabled: true
  model_folder: storage/models/2025-07-30_13:32:31  # Will need to update after SMOTE training
  data_source: storage/data/capital_com/GBPUSD/processed/1m/2025-03-02_2025-07-01.csv
  start_date: "2025-06-08"
  end_date: "2025-06-16"
  buffer_size: 200
  initial_capital: 10000
  transaction_costs: 0.0005
  slippage: 0.0002

  execution:
    max_loops: 5000
    loop_interval: 0

  signal_processing:
    confidence_threshold: 0.001      # ULTRA-LOW threshold
    signal_filters: []
    min_signal_strength: 0.001       # ULTRA-LOW minimum
    volume_confirmation_required: false

  risk_management:
    max_position_size: 0.02          # VERY small positions due to low confidence
    stop_loss_pct: 0.008             # Tight stop loss
    take_profit_pct: 0.02            # Tight take profit
    max_drawdown: 0.3
    max_concurrent_positions: 1      # Only 1 position due to uncertainty
    position_size_scaling: "volatility"

  position_management:
    max_concurrent_positions: 1
    position_tracking: "detailed"

  exit_strategy:
    confidence_exit_threshold: 0.70  # Lower exit threshold
    signal_strength_decay: 0.7       # More aggressive decay
    volatility_exit_multiplier: 2.0
    minimum_signal_life: 3           # Very short minimum hold

  signal_tracking:
    signal_strength_features:
      - compression_ratio_micro
      - volume_ratio
      - signal_strength_v2
      - compression_consistency
      - volatility_short
      - spread_baseline