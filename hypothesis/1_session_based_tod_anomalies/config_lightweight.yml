hypothesis:
    name: session_based_tod_anomalies

strategy:
    hypothesis_name: session_based_tod_anomalies
    model_folder: storage/models/2025-07-03_12:45:35

    data:
        symbol: GBPUSD
        timeframe: MINUTE
        buffer_size: 100       # Much smaller buffer for testing
        feature_window: 30     # Minimum for validation (down from 35)
        dry_run: true          # Pure simulation mode
        jumpstart: true        # Preload buffer with historical data
        use_websocket: false   # Use simulation data
        selected_features: [   # Only essential features - no seasonal decomposition
            "sma_5", "sma_10", "sma_20", "ema_5", "ema_10", "ema_20",
            "roc_1", "roc_5", "atr", "upper_band", "lower_band", 
            "vma_7", "relative_volume_7", "rsi_14", "macd_line",
            "hour_sin", "hour_cos", "day_of_week_sin", "day_of_week_cos",
            "is_monday", "is_friday", "asian_session", "london_session", 
            "ny_session", "primary_session", "session_intensity",
            "volatility_short", "volatility_long", "returns"
        ]

    execution:
        max_loops: 3         # Very short for testing 
        loop_interval: 2     # Fast intervals for testing

    signal_processing:
        confidence_threshold: 0.5  # Lower threshold for testing
        signal_filters: []         # No filters for testing

    risk_management:
        max_position_size: 0.02  # 2% of capital
        stop_loss_pct: 0.01      # 1% stop loss
        max_drawdown: 0.05       # 5% max drawdown

    position_management:
        max_concurrent_positions: 3
        position_tracking: detailed

    order_management:
        broker: capital_com
        order_type: market
        execution_delay: 0.1
        dry_run: true  # Simulation orders only

    monitoring:
        update_interval: 1.0  # Position update frequency in seconds