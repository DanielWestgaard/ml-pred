hypothesis:
    name: session_based_tod_anomalies

strategy:
    hypothesis_name: session_based_tod_anomalies
    model_folder: storage/models/2025-07-03_12:45:35

    data:
        symbol: GBPUSD
        timeframe: MINUTE
        buffer_size: 350
        feature_window: 35  # Must be >= 30 for validation
        dry_run: true  # Pure simulation mode
        jumpstart: true  # Preload buffer with historical data
        use_websocket: false  # Use simulation data
        selected_features: [  # Use exact features from model metadata
            "open", "high", "low", "close", "volume", "hour_sin", "hour_cos",
            "hour_of_week_sin", "hour_of_week_cos", "is_weekend", "month_progress_sin",
            "month_progress_cos", "month_period", "month_of_year_sin", "month_of_year_cos",
            "day_of_week_sin", "day_of_week_cos", "is_monday", "is_friday", "is_midweek",
            "friday_afternoon", "sunday_evening", "atr", "returns", "volatility_short",
            "volatility_long", "volatility_ratio", "volatility_regime", "volatility_zscore",
            "volatility_change", "vol_regime_high", "vol_regime_low", "vol_regime_medium",
            "activity", "asian_session", "london_session", "ny_session", "asian_london_overlap",
            "london_ny_overlap", "primary_session", "session_intensity", "minutes_since_session_start",
            "session_progress", "session_progress_sin", "session_progress_cos", "minutes_to_next_session",
            "session_transition", "pre_london", "pre_ny", "london_close", "session_atr_mean",
            "session_atr_std", "future_atr", "close_og"
        ]

    execution:
        max_loops: 5         # Very short for testing 
        loop_interval: 2     # Fast intervals for testing

    signal_processing:
        confidence_threshold: 0.7
        signal_filters: ['session_filter', 'volatility_filter']

    risk_management:
        max_position_size: 0.02  # 2% of capital
        stop_loss_pct: 0.01      # 1% stop loss
        max_drawdown: 0.05       # 5% max drawdown

    position_management:
        max_concurrent_positions: 3
        position_tracking: detailed

    order_management:
        broker: capital_com
        order_type: market
        execution_delay: 0.1
        dry_run: true  # Simulation orders only

    monitoring:
        update_interval: 1.0  # Position update frequency in seconds