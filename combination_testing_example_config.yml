# Example configuration for combination testing
hypothesis:
  name: "systematic_combination_discovery"
  description: "Test market + calendar event combinations for CLOV to find institutional blind spots"

# Existing multi_data section (reused)
multi_data:
  purpose: "historical"
  symbol: "CLOV"
  from_date: "2022-01-01" 
  to_date: "2025-01-01"
  sources: [calendar_events]

# 🆕 NEW: Combination testing section
combination_testing:
  enabled: true
  
  # Testing strategy
  strategy: "statistical"  # Simple statistical analysis for Phase 1
  
  # Test matrix configuration 
  test_matrix:
    base_features: ["Close", "Volume", "spread_avg"]  # Core market features
    # Calendar features will be auto-detected from combined data
  
  # Validation criteria (all optional with sensible defaults)
  validation:
    min_correlation_threshold: 0.05  # Lower threshold for initial discovery
    significance_level: 0.05         # 5% significance level
    min_data_points: 100            # Minimum sample size
    
  # Output preferences (all optional)
  results:
    save_detailed: true
    generate_visualizations: false  # Keep simple for Phase 1
    rank_combinations: true