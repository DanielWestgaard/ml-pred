# Example configuration for AdvancedSignalProcessor in backtesting
# Add this to your hypothesis config under the 'backtesting' section

backtesting:
  enabled: true
  initial_capital: 10000
  
  # ENABLE ADVANCED SIGNAL FILTERING
  signal_processing:
    use_advanced_filtering: true          # Set to true to use AdvancedSignalProcessor
    
    # Core filtering parameters (addresses your "0.4948 constantly" issue)
    confidence_threshold: 0.49            # Just below your model's flat 0.4948
    min_confidence_delta: 0.05            # Only trade on confidence jumps >0.05
    
    # Temporal filtering (reduces 1440→32-96 signals/day)
    cooldown_minutes: 30                  # 30min cooldown between same-direction signals
    max_signals_per_hour: 2               # Hard limit: max 2 signals per hour
    
    # Confidence tracking window
    confidence_window_minutes: 10         # Track rolling 10-min confidence average
    
    # Optional: Add traditional filters too
    signal_filters: 
      - "volatility_filter"              # Filter extreme volatility
      - "session_filter"                 # Only trade during active sessions
  
  # Risk management (unchanged)
  risk_management:
    max_position_size: 0.02
    stop_loss_pct: 0.01
    take_profit_pct: 0.02
    max_concurrent_positions: 3

# Expected Results:
# - Transforms "1000+ low-value signals" → "10-20 high-value signals" per day
# - Stops trading on flat 0.4948 confidence - only trades on significant jumps
# - Prioritizes directional changes (BUY→SELL) over repetitive signals (SELL→SELL→SELL)
# - Real-time monitoring shows: "Filter: 2/hr, Avg:0.531" in progress logs